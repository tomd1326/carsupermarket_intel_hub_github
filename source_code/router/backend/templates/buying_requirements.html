<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buying Requirements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <a href="{{ BASE_URL }}/home" class="btn btn-outline-secondary btn-sm mb-4">
            <i class="fas fa-arrow-left"></i> Back
        </a>
        <h2>Buying Requirements</h2>
        <p class="text-muted">Coming soon.</p>

        <hr class="my-4">

        <!-- Snowflake connection test -->
        <div>
            <button id="testBtn" class="btn btn-outline-secondary" onclick="testSnowflake()">
                <i class="fas fa-plug"></i> Test Snowflake Connection
            </button>

            <!-- Error alert - hidden by default -->
            <div id="errorResult" class="alert alert-danger mt-3 d-none" role="alert"></div>

            <!-- Success detail card - hidden by default -->
            <div id="successResult" class="card mt-3 d-none">
                <div class="card-header bg-success text-white">
                    <i class="fas fa-check-circle me-2"></i> Connected to Snowflake
                </div>
                <div class="card-body">
                    <table class="table table-sm table-borderless mb-0">
                        <tbody>
                            <tr>
                                <td class="text-muted fw-bold" style="width:140px">Warehouse</td>
                                <td id="sf-warehouse"></td>
                            </tr>
                            <tr class="table-success">
                                <td class="text-muted fw-bold">Target Table</td>
                                <td id="sf-table"></td>
                            </tr>
                            <tr class="table-success">
                                <td class="text-muted fw-bold">Row Count</td>
                                <td id="sf-rows"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function testSnowflake() {
            const btn = document.getElementById('testBtn');
            const errorResult = document.getElementById('errorResult');
            const successResult = document.getElementById('successResult');

            // Show spinner, hide previous results
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Testing...';
            errorResult.className = 'alert alert-danger mt-3 d-none';
            successResult.className = 'card mt-3 d-none';

            fetch('{{ BASE_URL }}/buying-requirements/test-snowflake')
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'ok') {
                        document.getElementById('sf-warehouse').textContent = data.warehouse || '—';
                        document.getElementById('sf-table').textContent = data.target_table;
                        document.getElementById('sf-rows').textContent = data.row_count.toLocaleString();
                        successResult.className = 'card mt-3';
                    } else {
                        errorResult.innerHTML = '<i class="fas fa-times-circle me-2"></i>' + data.message;
                        errorResult.className = 'alert alert-danger mt-3';
                    }
                })
                .catch(err => {
                    errorResult.innerHTML = '<i class="fas fa-times-circle me-2"></i>Request failed: ' + err;
                    errorResult.className = 'alert alert-danger mt-3';
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-plug"></i> Test Snowflake Connection';
                });
        }
    </script>
</body>
</html>
