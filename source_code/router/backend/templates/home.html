<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .home-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .menu-btn {
            width: 280px;
            height: 100px;
            font-size: 1.2rem;
            font-weight: 500;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .logout-link {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <a href="{{ BASE_URL }}/logout" class="logout-link text-secondary">
        <i class="fas fa-sign-out-alt"></i> Logout
    </a>
    <div class="home-container">
        <h2 class="mb-5">CarSupermarket.com Buying Tools</h2>
        <div class="d-flex flex-column gap-4">
            <a href="{{ BASE_URL }}/buying-requirements" class="btn btn-outline-primary menu-btn">
                <i class="fas fa-list-check"></i> Buying Requirements
            </a>
            <a href="{{ BASE_URL }}/tasks" class="btn btn-outline-primary menu-btn">
                <i class="fas fa-file-upload"></i> Evaluate Supplier List
            </a>
        </div>
    </div>
</body>
</html>
