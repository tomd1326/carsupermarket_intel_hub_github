<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buying Tools</title>
    <link rel="icon" type="image/png" href="{{ BASE_URL }}/static/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @font-face { font-family: 'DM Sans'; src: url('/static/fonts/DMSans-Regular.ttf'); font-weight: 400; }
        @font-face { font-family: 'DM Sans'; src: url('/static/fonts/DMSans-Medium.ttf'); font-weight: 500; }
        @font-face { font-family: 'DM Sans'; src: url('/static/fonts/DMSans-SemiBold.ttf'); font-weight: 600; }
        @font-face { font-family: 'DM Sans'; src: url('/static/fonts/DMSans-Bold.ttf'); font-weight: 700; }

        body, button, input, select, textarea { font-family: 'DM Sans', system-ui, sans-serif; }
        body {
            background-color: #0d3d5f;
        }
        .home-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 20vh;
        }
        .brand-logo {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .home-title {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .menu-btn {
            width: 280px;
            height: 80px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #7ed321;
            border: none;
            color: #0d3d5f;
        }
        .menu-btn:hover {
            background-color: #6cba18;
            color: #0d3d5f;
        }
        .logout-link {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6) !important;
        }
        .logout-link:hover {
            color: #ffffff !important;
        }
        .menu-btn-settings {
            width: 280px;
            height: 80px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #4a5568;
            border: none;
            color: #ffffff;
        }
        .menu-btn-settings:hover {
            background-color: #2d3748;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <a href="{{ BASE_URL }}/logout" class="logout-link text-secondary">
        <i class="fas fa-sign-out-alt"></i> Logout
    </a>
    <div class="home-container">
        <img src="{{ BASE_URL }}/static/icon.png" alt="CarSupermarket" class="brand-logo">
        <h2 class="home-title mb-5">CarSupermarket.com Buying Tools</h2>
        <div class="d-flex flex-column gap-4">
            <a href="{{ BASE_URL }}/buying-requirements" class="btn menu-btn">
                Buying Requirements
            </a>
            <a href="{{ BASE_URL }}/tasks" class="btn menu-btn">
                Supplier Stock Evaluator
            </a>
            {% if user == 'admin' %}
            <a href="{{ BASE_URL }}/settings-page" class="btn menu-btn-settings">
                <i class="fas fa-cog"></i> Settings
            </a>
            {% endif %}
        </div>
    </div>
</body>
</html>
