{% from '_navigation.html' import page_header with context %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_name('trade_report') }}</title>
    <link rel="icon" type="image/png" href="{{ BASE_URL }}/static/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Shared tokens first, then the chart cards shared with the KPI page,
         then this page's own styles. -->
    <link href="{{ static_url('css/theme.css') }}" rel="stylesheet">
    <link href="{{ static_url('css/charts.css') }}" rel="stylesheet">
    <!-- The saved font size is rendered here so the page paints at the right
         size straight away instead of being resized by JS after load. -->
    <style>
        :root { --page-font: {{ font_size }}px; }
    </style>
    <link href="{{ static_url('css/trade_report.css') }}" rel="stylesheet">
</head>
<body>
    {% call page_header(page_name('trade_report'), user) %}
            <span class="cache-note" id="cache-note"></span>
            <button class="btn btn-refresh ms-2" id="refresh-btn" onclick="refreshData()" title="Reload the latest data from Snowflake">
                <i class="fas fa-rotate-right"></i> Refresh Data
            </button>
            <div class="d-flex align-items-center gap-1 ms-2">
                <span class="text-muted">Font</span>
                <button class="btn btn-outline-secondary px-2 py-0" onclick="changeFont(-1)">&minus;</button>
                <span id="font-size-label" class="text-muted" style="min-width:32px;text-align:center">{{ font_size }}</span>
                <button class="btn btn-outline-secondary px-2 py-0" onclick="changeFont(1)">+</button>
                <button class="btn btn-outline-secondary px-2 py-0" title="Reset font size" onclick="resetFont()"><i class="fas fa-rotate-left"></i></button>
            </div>
    {% endcall %}
    <div class="container-fluid py-4" style="max-width: 100%; padding-left: 24px; padding-right: 24px;">

        <!-- Control bar: which cut of the data, which period, which supplier
             category. Every change re-renders from the rows already loaded. -->
        <div class="panel shadow-sm mb-3" id="control-bar">
            <div class="control-row">
                <div class="control-group">
                    <span class="control-label">View</span>
                    <div class="lens-toggle" id="view-toggle">
                        <button data-view="month_site" class="active">Month By Site</button>
                        <button data-view="month_auction">Month By Auction</button>
                        <button data-view="year_month">Year By Month</button>
                        <button data-view="year_site">Year By Site</button>
                        <button data-view="year_auction">Year By Auction</button>
                        <button data-view="vehicles">Vehicles</button>
                    </div>
                </div>
                <div class="control-group">
                    <span class="control-label" id="period-label">Month</span>
                    <select class="form-select form-select-sm period-select" id="period-select" disabled></select>
                </div>
                <div class="control-group">
                    <span class="control-label">Supplier Category</span>
                    <div class="lens-toggle" id="category-toggle">
                        <button data-category="" class="active">All</button>
                        <button data-category="PX/Buy In">PX/Buy In</button>
                        <button data-category="Buy Back">Buy Back</button>
                        <button data-category="B2B Purchase">B2B Purchase</button>
                    </div>
                </div>
                <div class="control-group">
                    <span class="control-label">Show</span>
                    <div class="lens-toggle" id="show-toggle">
                        <button data-show="both" class="active">Tables And Charts</button>
                        <button data-show="tables">Tables</button>
                        <button data-show="charts">Charts</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="report-area">
            <div class="panel shadow-sm">
                <div class="spinner-wrap"><div class="css-spinner"></div><div style="margin-top:12px;font-size:0.9rem;">Loading trade sales...</div></div>
            </div>
        </div>
    </div>

    <script>
        window.BASE_URL = "{{ BASE_URL }}";
        window.TRADE_FONT = { size: {{ font_size }}, prefKey: "{{ font_pref }}" };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ static_url('js/charts.js') }}"></script>
    <script src="{{ static_url('js/trade_report.js') }}"></script>
</body>
</html>
