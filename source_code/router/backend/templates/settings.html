<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="icon" type="image/png" href="{{ BASE_URL }}/static/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, button, input, select, textarea { font-family: 'DM Sans', system-ui, sans-serif; }
        .settings-card { max-width: 520px; margin: 60px auto; }
        .card-header { background-color: #ced4da; }
    </style>
</head>
<body class="bg-light">
    <div class="settings-card">
        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="{{ BASE_URL }}/home" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Back
            </a>
            <h4 class="mb-0">Settings</h4>
        </div>

        {% if request.query_params.get('saved') %}
        <div class="alert alert-success py-2 px-3 mb-4 small">Settings saved.</div>
        {% endif %}

        <form method="post" action="{{ BASE_URL }}/settings">
            <div class="card mb-4">
                <div class="card-header fw-semibold">Buying Requirements</div>
                <div class="card-body">
                    <div class="d-flex gap-3 flex-wrap">
                        <div>
                            <label for="number_to_buy" class="form-label mb-1">Number to Buy</label>
                            <input class="form-control" type="number" id="number_to_buy" name="number_to_buy"
                                   value="{{ settings.number_to_buy }}" min="0" style="width: 110px;" onclick="this.select()">
                        </div>
                        <div>
                            <label for="max_days_sales" class="form-label mb-1">Max Days Sales</label>
                            <input class="form-control" type="number" id="max_days_sales" name="max_days_sales"
                                   value="{{ settings.max_days_sales }}" min="1" max="90" style="width: 110px;" onclick="this.select()">
                        </div>
                        <div>
                            <label for="max_dts" class="form-label mb-1">Max DTS</label>
                            <input class="form-control" type="number" id="max_dts" name="max_dts"
                                   value="{{ settings.max_dts }}" min="1" style="width: 100px;" onclick="this.select()">
                        </div>
                        <div>
                            <label for="min_gpu_m" class="form-label mb-1">Min GPU-M</label>
                            <input class="form-control" type="number" id="min_gpu_m" name="min_gpu_m"
                                   value="{{ settings.min_gpu_m }}" style="width: 100px;" onclick="this.select()">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header fw-semibold">Supplier Stock Evaluator</div>
                <div class="card-body">
                    <div class="d-flex gap-3 flex-wrap mb-3">
                        <div>
                            <label for="cap_workers" class="form-label mb-1">CAP Workers</label>
                            <input class="form-control" type="number" id="cap_workers" name="cap_workers"
                                   value="{{ settings.cap_workers }}" min="1" max="40" style="width: 110px;">
                            <div class="form-text">Max: 40</div>
                        </div>
                        <div>
                            <label for="cap_rate_limit" class="form-label mb-1">Rate Limit (req/s)</label>
                            <input class="form-control" type="number" id="cap_rate_limit" name="cap_rate_limit"
                                   value="{{ settings.cap_rate_limit }}" min="1" max="500" style="width: 110px;">
                            <div class="form-text">Max: 500</div>
                        </div>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="calc_buying_reqs" name="calc_buying_reqs"
                               {% if settings.calc_buying_reqs %}checked{% endif %}>
                        <label class="form-check-label" for="calc_buying_reqs">Calculate Buying Requirements on download</label>
                    </div>
                    <div class="form-text">When enabled, downloaded lists include buying requirements calculations using the settings above.</div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
    </div>
</body>
</html>
