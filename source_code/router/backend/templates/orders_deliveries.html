<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders &amp; Deliveries Report</title>
    <link rel="icon" type="image/png" href="{{ BASE_URL }}/static/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Shared tokens (colours, borders, radii, shading scale) — see theme.css.
         Loaded before the page's own styles so anything below can override. -->
    <link href="{{ static_url('css/theme.css') }}" rel="stylesheet">
    <style>
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Regular.ttf');  font-weight: 400; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Medium.ttf');   font-weight: 500; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-SemiBold.ttf'); font-weight: 600; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Bold.ttf');     font-weight: 700; }
        body, button, input, select, textarea { font-family: 'DM Sans', system-ui, sans-serif; }
        body { background-color: var(--c-page-bg); }
        /* Sized in em so the whole header block follows the page font resizer.
           The h3's own Bootstrap size is overridden for the same reason. */
        .page-header { color: var(--c-text-heading); font-weight: 700; letter-spacing: -0.3px; font-size: 1.6em; }
        .back-link { color: var(--c-text-muted) !important; text-decoration: none; }
        .back-link:hover { color: var(--c-text) !important; }
        /* .panel, .info-mark and .css-spinner come from theme.css. .nav-btn is
           overridden here (em not rem) so it scales with the page font. */
        .nav-btn { font-size: 1em; padding: 0.35em 0.7em; }
        /* Matches the slicer bar's rendered width at the base panel size
           (8 * 163px + 7 * 10px gaps + this bar's own padding), so the bar is
           already correctly sized before any data/JS has run. Once data
           renders, JS measures the panels' real right edge and sets this
           width to match (matchFilterWidthToTable()) — the panels themselves
           always stay at the base width, in both views. If a slicer dimension
           is ever added or removed, update this number too (or just let JS
           take over once data loads). */
        #control-bar { box-sizing: border-box; width: 1410px; max-width: 100%; }
        /* Real summary tables hug their own content; the loading spinner
           instead spans the same width as the control bar so it doesn't look
           like a narrow box floating under a full-width bar. */
        #summary-area { width: fit-content; }
        #summary-area.is-loading { width: 1410px; box-sizing: border-box; }
        .control-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
        /* This row (Lens/View/Group by/Apply) must always stay on one line.
           #control-bar's width is set by JS to match the filter panels
           (matchFilterWidthToTable()), which can be narrower than this bar's
           1410px loading-state fallback once real data replaces the
           placeholder. Without nowrap, that narrower width can wrap this row
           onto two lines, growing #control-bar taller and shifting the
           slicer bar below it down — a layout jump with no data change to
           explain it. The second control-row (font resizer/Refresh/CSV) is
           left wrapping, since it can genuinely reflow on a narrow screen. */
        #toolbar-row { flex-wrap: nowrap; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        /* 1em throughout the control bar so it reads at the same size as the
           summary tables below it, rather than a notch smaller. */
        .control-label { font-size: 1em; font-weight: 600; color: var(--c-text-muted); }

        /* Lens / View / Group by toggles — dark active state, grey outline when
           inactive, same idea as the filter pills on buying requirements. */
        .lens-toggle { display: inline-flex; background: var(--c-surface-sunken); border-radius: var(--radius-md); padding: 3px; }
        .lens-toggle button {
            border: 1px solid var(--c-control-border); background: var(--c-surface); color: var(--c-text);
            font-weight: 600; font-size: 1em; padding: 0.5em 1.2em; border-radius: var(--radius-sm); cursor: pointer;
        }
        .lens-toggle button + button { margin-left: 3px; }
        .lens-toggle button:hover { border-color: var(--c-control-border-hover); background: var(--c-surface-alt); }
        .lens-toggle button.active { background: var(--c-dark); color: var(--c-surface); border-color: var(--c-dark); }
        .lens-toggle button.active:hover { background: var(--c-dark); }

        /* Apply / Refresh / CSV. These carry page-specific state (Apply greys
           out while loading) so they are hand-written rather than plain
           Bootstrap classes, but they use the same colours. */
        .btn-apply {
            background-color: var(--c-primary); border: 1px solid var(--c-primary); color: var(--c-surface); font-weight: 600;
            font-size: 1em; padding: 0.5em 1.2em; border-radius: var(--radius-md); cursor: pointer;
        }
        .btn-apply:hover { background-color: var(--c-primary-hover); border-color: var(--c-primary-hover); }
        .btn-apply.loading {
            background-color: var(--c-disabled-bg); border-color: var(--c-disabled-border); color: var(--c-disabled-text); cursor: default;
        }
        .btn-apply.loading:hover { background-color: var(--c-disabled-bg); border-color: var(--c-disabled-border); }
        .filter-input { border: 1px solid var(--c-disabled-border); border-radius: var(--radius-md); padding: 4px 8px; font-size: 0.75em; color: var(--c-text); width: 180px; }
        .btn-csv { background-color: var(--c-success); border: 1px solid var(--c-success); color: var(--c-surface); font-weight: 600; font-size: 0.9em; padding: 7px 18px; }
        .btn-csv:hover { background-color: var(--c-success-hover); border-color: var(--c-success-hover); color: var(--c-surface); }
        .btn-refresh { background-color: var(--c-surface); border: 1px solid var(--c-control-border); color: var(--c-text); font-weight: 600; font-size: 0.9em; padding: 7px 15px; }
        .btn-refresh:hover { background-color: var(--c-disabled-bg); color: var(--c-dark); }
        .btn-refresh:disabled { opacity: 0.6; cursor: default; }
        .cache-note { color: var(--c-text-muted); font-size: 1em; }

        /* Slicer bar — fixed-width panels; scroll horizontally rather than
           squashing them narrower to fit. */
        :root { --slicer-width: 163px; }
        .slicer-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
        .slicer {
            background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius-lg); padding: 8px 10px;
            display: flex; flex-direction: column; min-height: 0;
            /* border-box: matchFilterWidthToTable() measures panels with
               getBoundingClientRect() (the real rendered/border-box size) and
               writes its result straight into --slicer-width. Without
               border-box, width: var(--slicer-width) sets the CONTENT box only,
               so the actual panel renders padding+border wider than the value
               the JS calculated — a ~22px error per panel that compounds across
               all 8 and pushes the last panel's right edge past the card's. */
            box-sizing: border-box;
            flex: 0 0 var(--slicer-width); width: var(--slicer-width);
        }
        .slicer-head {
            display: flex; align-items: center; justify-content: space-between;
            font-weight: 600; font-size: 1em; color: var(--c-text-heading);
            padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--c-border-soft);
        }
        .slicer-clear {
            border: none; background: transparent; color: var(--c-text-muted); cursor: pointer;
            font-size: 0.85em; padding: 2px 4px;
        }
        .slicer-clear:hover { color: var(--c-text-danger); }
        .slicer-clear.hidden { visibility: hidden; }
        /* Tall enough to fit Price Band's 8 full-height pills with no scroll.
           Only longer lists (Supplier) scroll. Height is in em, not px, so the
           panel grows with the font and still fits those 8 pills — a fixed
           pixel height would start scrolling as soon as the text got bigger.
           8 pills x (1.4em line + 0.7em padding + 2px border) + 7 x 4px gaps. */
        .slicer-list { overflow-y: auto; height: 19em; display: flex; flex-direction: column; gap: 4px; }
        .slicer-item {
            font-size: 1em; color: var(--c-text); padding: 0.35em 0.7em; border-radius: var(--radius-sm);
            cursor: pointer; border: 1px solid var(--c-border-soft); background: var(--c-surface-alt);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            user-select: none;
            flex: 0 0 auto;   /* never shrink — full-height pills always */
        }
        .slicer-item:hover { border-color: var(--c-control-border); }
        .slicer-item.selected { background: var(--c-dark); color: var(--c-surface); border-color: var(--c-dark); }

        /* Two independent sizes, each persisted per user in Aurora:
             --page-font    everything on the page EXCEPT the vehicle grid —
                            control bar, slicers, summary tables, buttons. Set
                            on <body> so anything sized in em/rem follows it.
             --vehicle-font the vehicle view's grid only, which has its own
                            resizer next to that table's CSV button.
           Padding is in em throughout, so it scales with the text. */
        :root { --vehicle-font: {{ font_vehicle }}px; --page-font: {{ font_summary }}px; }
        body { font-size: var(--page-font); }
        /* Bootstrap sets its own font-size on .btn/.form-control, so those need
           pointing back at the page size to scale with everything else. */
        .btn, .form-control, .form-label { font-size: 1em; }
        .grid-wrap { max-height: 74vh; overflow: auto; border: 1px solid var(--c-border); border-radius: var(--radius-md); }
        table.grid { border-collapse: collapse; font-size: var(--vehicle-font); table-layout: fixed; width: 100%; }
        table.grid thead th {
            position: sticky; top: 0; z-index: 2; background: var(--c-table-header-bg); color: var(--c-table-header-text);
            text-align: left; font-size: 0.95em; font-weight: 600; padding: 0.4em 0.6em;
            cursor: pointer; user-select: none; border-right: 1px solid var(--c-border);
            white-space: normal; line-height: 1.2; vertical-align: bottom;
            overflow-wrap: break-word;
            /* Header/body divider, matching the summary and popup tables.
               Drawn as a box-shadow, not a border: this table is
               border-collapse: collapse, where a collapsed border belongs to
               the table grid rather than the cell, so it scrolls away with the
               rows instead of staying under the pinned header. A shadow is
               painted with the sticky cell itself and stays put. */
            box-shadow: inset 0 -1px 0 var(--c-border);
        }
        table.grid thead th:hover { background: var(--c-table-header-hover); }
        table.grid thead th .sort-caret { opacity: 0.5; margin-left: 4px; font-size: 0.85em; white-space: nowrap; }
        table.grid td {
            padding: 0.35em 0.6em; color: var(--c-text); border-bottom: 1px solid var(--c-border); border-right: 1px solid var(--c-border-soft);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        table.grid tbody tr:nth-child(even) { background: var(--c-surface-alt); }
        table.grid tbody tr:hover { background: var(--c-table-total-bg); }
        table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
        table.grid td.neg { color: var(--c-text-danger); }

        /* Both font resizers use Bootstrap's btn-outline-secondary btn-sm,
           matching buying_requirements.html — no bespoke styling needed. */
        table.grid a { color: var(--c-primary); text-decoration: none; }
        table.grid a:hover { text-decoration: underline; }
        .empty-state { color: var(--c-text-muted); font-size: 0.9em; text-align: center; padding: 40px 0; }
        .spinner-wrap { text-align: center; padding: 60px 0; color: var(--c-text-heading); }
        /* .css-spinner comes from theme.css */

        /* Summary tables — one per dimension, stacked vertically. Sized to
           content (not full width) with a shared colgroup so every table's
           columns line up exactly regardless of which dimension it shows. */
        /* No overflow here at all. overflow-x: auto forces overflow-y to auto
           too (`visible` is not kept on one axis while the other scrolls), and
           when the table is wider than the wrapper the horizontal scrollbar
           takes height INSIDE the box — which then overflows vertically and
           adds a second, pointless scrollbar. overflow-y: hidden would stop
           that but clip the DIS/Sell info-mark tooltips, which open downward
           out of the header. The summary card (#summary-area) is already
           width: fit-content and the filter panels are sized to match it, so
           these tables are not actually forced to scroll — leaving overflow
           alone keeps the tooltips visible and both scrollbars away. */
        .summary-table-wrap { margin: 0 1px 22px; }
        .summary-table-wrap:last-child { margin-bottom: 0; }
        table.summary {
            border-collapse: separate; border-spacing: 0; font-size: 1em; white-space: nowrap;
            table-layout: fixed; width: auto;
            border: 1px solid var(--c-border); border-radius: var(--radius-md);
        }
        table.summary th {
            background: var(--c-table-header-bg); color: var(--c-table-header-text); text-align: left;
            font-size: 0.95em; font-weight: 600; padding: 0.5em 0.7em;
            border-right: 1px solid var(--c-border);
            /* Same line the popup's header already has (table.vehicle-modal-table
               th) — was missing here, so there was nothing separating the
               header from the first data row, just the row's own top-adjacent
               border which reads as a body-row divider, not a header edge. */
            border-bottom: 1px solid var(--c-border);
            overflow: hidden; text-overflow: ellipsis;
        }
        table.summary th.num, table.summary td.num { text-align: right; font-variant-numeric: tabular-nums; }
        /* A heading carrying an info marker must not clip, or its tooltip is
           cut off at the cell edge. Only these cells opt out of the ellipsis
           overflow above; their labels are short enough not to need it. */
        table.summary th:has(.info-mark),
        table.vehicle-modal-table th:has(.info-mark) { overflow: visible; }
        table.summary td {
            padding: 0.35em 0.7em; color: var(--c-text);
            border-bottom: 1px solid var(--c-border); border-right: 1px solid var(--c-border-soft);
            overflow: hidden; text-overflow: ellipsis;
        }
        /* The last column's right border sits directly on the table's own
           outer frame (border: 1px solid var(--c-border) above) instead of
           against another cell. Two different border colours stacked in the
           same pixel column don't blend into one soft line — the darker frame
           colour wins by contrast and reads as a heavier edge than the
           interior gridlines. Drop the cell's own border there; the frame
           alone draws that edge. */
        table.summary th:last-child, table.summary td:last-child { border-right: none; }
        table.summary td.neg { color: var(--c-text-danger); }
        /* .info-mark comes from theme.css */
        table.summary td.dim-label { font-weight: 600; color: var(--c-text-heading); }
        /* Grand Total separator: one solid line, with no lighter line adjacent
           (that's what read as a "gap"). */
        table.summary tbody tr.total-row td { font-weight: 700; background: var(--c-table-total-bg); border-top: 2px solid var(--c-border-strong); border-bottom: none; }
        table.summary tbody tr:has(+ tr.total-row) td { border-bottom: none; }
        table.summary tbody tr.spacer-row td { padding: 4px 0; border: none; background: transparent; }
        /* Corner rounding on the cells themselves, not overflow:hidden on the
           table — same fix as table.vehicle-modal-table below. overflow:hidden
           clips the header cell's own square-cornered border into a rounded
           shape rather than the border being drawn rounded to start with; where
           the th's border-bottom (added above) and border-right meet the
           table's own outer border in that corner, the clip leaves an
           extra-thick pixel cluster instead of a clean curve. */
        table.summary thead tr:first-child th:first-child { border-top-left-radius: var(--radius-md); }
        table.summary thead tr:first-child th:last-child { border-top-right-radius: var(--radius-md); }
        table.summary tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius-md); }
        table.summary tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius-md); }
        /* View column — button sized off the summary font so the row height
           doesn't jump when the font resizer is used. */
        table.summary td.view-cell { text-align: center; padding: 0.15em 0.3em; }
        .btn-view {
            border: 1px solid var(--c-primary); background: var(--c-surface); color: var(--c-primary);
            font-weight: 600; font-size: 0.9em; line-height: 1.2;
            padding: 0.15em 0.6em; border-radius: var(--radius-sm); cursor: pointer;
        }
        .btn-view:hover { background: var(--c-primary); color: var(--c-surface); }

        /* Vehicle list popup */
        .modal-backdrop-custom {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1050;
        }
        /* Sized to the table's own content (13 columns), capped so it never
           runs off screen — the body scrolls in both directions instead. */
        .vehicle-modal {
            position: fixed; top: 8vh; left: 50%; transform: translateX(-50%);
            z-index: 1060; background: var(--c-surface); border-radius: var(--radius-lg);
            width: max-content; max-width: 94vw; max-height: 80vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.22);
            /* One step smaller than the page font — this sizes the popup's
               CHROME (title, subtitle, close button). The table inside sets its
               own size from --vehicle-font instead, so it matches the Vehicle
               view exactly; see table.vehicle-modal-table. */
            font-size: calc(var(--page-font) - 1px);
        }
        .vehicle-modal-head {
            display: flex; align-items: center; justify-content: space-between;
            /* 18px sides match the body's padding below, so the title lines up
               with the table's left edge and the close button with its right. */
            padding: 12px 18px; border-bottom: 1px solid var(--c-border-soft);
        }
        /* Matches the table body's own text size (table.vehicle-modal-table is
           1em of the page font) rather than a fraction of the page font
           directly — was 0.95em/0.78em of the page font, which read
           noticeably smaller than the table underneath it. */
        .vehicle-modal-title { font-weight: 600; color: var(--c-text-heading); font-size: 1.1em; }
        .vehicle-modal-sub { color: var(--c-text-muted); font-size: 0.95em; }
        .vehicle-modal-close {
            border: none; background: transparent; color: var(--c-text-muted);
            font-size: 1.8em; line-height: 1; cursor: pointer; padding: 2px 6px;
        }
        .vehicle-modal-close:hover { color: var(--c-text-danger); }
        /* Same white surround the summary tables sit in — .panel's 13px/18px
           padding — so the table has an identical margin inside its card. */
        /* No TOP padding on the scroll container: a sticky <th> pins to the
           padding box, so 13px of top padding leaves a 13px gap above the
           header that scrolling rows show through. The table's own top margin
           gives the same visual inset without affecting where the header
           sticks — it scrolls away, the padding would not. */
        /* No top padding: the header pins at top:0, flush with the scroll edge,
           so there is no gap above it for rows to scroll through and nothing to
           mask. The head bar above already provides the visual separation.
           A top padding here would either hold a row-revealing gap open (with
           top:0) or need the header's `top` kept exactly in step with it. */
        .vehicle-modal-body { overflow: auto; padding: 0 18px 13px; }
        /* Gridlines and outer frame identical to table.summary: grey border,
           6px radius, 1px separators between cells.
           No `overflow: hidden` here (unlike table.summary) — it would clip a
           sticky <th>, since the table would become the nearest overflow
           ancestor instead of .vehicle-modal-body. The rounded corners are
           preserved a different way: see the th/td corner rules below. */
        /* table-layout: fixed so the colgroup widths measured in JS are honoured
           exactly — auto layout would re-widen columns to fit the header on one
           line, which is the wrapping we are trying to allow. */
        table.vehicle-modal-table {
            border-collapse: separate; border-spacing: 0; width: auto;
            /* --vehicle-font, not 1em of the popup: this table shows the same
               columns as the Vehicle view and its widths are measured by the
               same function (measureVehicleColumnWidths, which measures against
               --vehicle-font). Sizing the text off anything else would leave
               the measured widths and the rendered text out of step. */
            font-size: var(--vehicle-font); white-space: nowrap; table-layout: fixed;
            border: 1px solid var(--c-border); border-radius: var(--radius-md);
        }
        table.vehicle-modal-table th {
            /* Pins flush to the scroll container's top edge, which has no top
               padding (see .vehicle-modal-body) — so it neither jumps on the
               first scroll nor leaves a gap for rows to show through. */
            position: sticky; top: 0; z-index: 3;
            background: var(--c-table-header-bg); color: var(--c-table-header-text); text-align: left;
            /* 0.6em sides, matching table.grid's header — the shared width
               measurement (VEHICLE_COL_PADDING) is calibrated to that padding,
               so a wider one here would leave every column slightly too tight. */
            font-size: 0.95em; font-weight: 600; padding: 0.5em 0.6em;
            border-right: 1px solid var(--c-border);
            /* Drawn explicitly: with border-collapse:separate a sticky header
               keeps no border from the row below it as that row scrolls under. */
            border-bottom: 1px solid var(--c-border);
            cursor: pointer; user-select: none;
            /* Wraps like the vehicle grid's headers rather than forcing the
               column as wide as the whole phrase. Bottom-aligned so a one-line
               and a three-line heading still sit on the same baseline.
               Capped at 3 lines: the widths are measured so nothing needs a 4th,
               but the clamp keeps one unexpectedly long label from making every
               popup header row tall. */
            white-space: normal; overflow-wrap: break-word;
            line-height: 1.2; vertical-align: bottom;
        }
        /* Three lines is the cap. Applied to an inner span rather than the cell:
           a max-height on the <th> itself does nothing (table cells grow to
           their content regardless), and -webkit-line-clamp would need
           display:-webkit-box, which fights the `overflow: visible` the
           info-mark tooltip relies on. 3 x the 1.2 line-height above. */
        table.vehicle-modal-table th .th-label {
            /* inline-block, not block: the info marker and sort caret sit
               alongside the label on its last line, and a block would push them
               onto a line of their own. */
            display: inline-block; max-width: 100%;
            max-height: 3.6em; overflow: hidden; vertical-align: bottom;
        }
        table.vehicle-modal-table th:hover { background: var(--c-table-header-hover); }
        table.vehicle-modal-table th.num { text-align: right; }
        table.vehicle-modal-table th .sort-caret { opacity: 0.5; margin-left: 4px; font-size: 0.85em; }
        table.vehicle-modal-table td {
            /* 0.6em sides to match table.grid's cells — see the th rule above. */
            padding: 0.35em 0.6em; color: var(--c-text);
            border-bottom: 1px solid var(--c-border); border-right: 1px solid var(--c-border-soft);
            /* Columns are fixed-width, so a value longer than its measured
               column (one capped at VEHICLE_COL_MAX_WIDTH) must be trimmed
               rather than spill into the next cell — same as the vehicle grid.
               (Last-column border-right is dropped below — see that rule for
               why: it would otherwise sit on the table's own outer frame
               border, a different, darker colour, and read as a thicker edge.) */
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        /* The 2px frame already draws the bottom edge — a row border under the
           last row would sit just inside it and read as a doubled line. */
        table.vehicle-modal-table tbody tr:last-child td { border-bottom: none; }
        /* Corner rounding, done on the cells themselves rather than via
           `overflow: hidden` on the table (which would break the sticky
           header above). Only the header's radius survives scrolling, since
           it stays pinned at the top; the body corners round the frame's
           bottom edge, which never moves. */
        table.vehicle-modal-table thead tr:first-child th:first-child { border-top-left-radius: 4px; }
        table.vehicle-modal-table thead tr:first-child th:last-child { border-top-right-radius: 4px; }
        table.vehicle-modal-table tbody tr:last-child td:first-child { border-bottom-left-radius: 4px; }
        table.vehicle-modal-table tbody tr:last-child td:last-child { border-bottom-right-radius: 4px; }
        /* Last column's td right border would otherwise sit directly on the
           table's own outer frame border (a darker colour — see table.summary
           for the same fix and why it reads as a thicker edge). The th's own
           border-right already matches the frame colour exactly, so only td
           needs this. */
        table.vehicle-modal-table td:last-child { border-right: none; }
        table.vehicle-modal-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
        table.vehicle-modal-table td.neg { color: var(--c-text-danger); }
        table.vehicle-modal-table tbody tr:nth-child(even) { background: var(--c-surface-alt); }
        /* .nav-btn comes from theme.css */
    </style>
</head>
<body>
    <div class="container-fluid py-4" style="max-width: 100%; padding-left: 24px; padding-right: 24px;">
        <div class="d-flex align-items-center mb-3">
            <h3 class="page-header mb-0">Orders &amp; Deliveries Report</h3>
            <span class="cache-note ms-3" id="cache-note"></span>
            <button class="btn btn-refresh ms-2" id="refresh-btn" onclick="refreshData()" title="Reload the latest data from Snowflake">
                <i class="fas fa-rotate-right"></i> Refresh Data
            </button>
            <!-- Page font resizer — scales everything except the vehicle grid,
                 which has its own resizer next to its CSV button. -->
            <div class="d-flex align-items-center gap-1 ms-auto">
                <span class="small text-muted">Font</span>
                <button class="btn btn-outline-secondary btn-sm px-2 py-0" onclick="changeFont('page', -1)">&minus;</button>
                <span id="font-size-label" class="small text-muted" style="min-width:32px;text-align:center">{{ font_summary }}</span>
                <button class="btn btn-outline-secondary btn-sm px-2 py-0" onclick="changeFont('page', 1)">+</button>
                <button class="btn btn-outline-secondary btn-sm px-2 py-0" title="Reset font size" onclick="resetFont('page')"><i class="fas fa-rotate-left"></i></button>
            </div>
            <a href="{{ BASE_URL }}/home" class="btn btn-outline-secondary nav-btn ms-3"><i class="fas fa-arrow-left me-1"></i>Home</a>
        </div>

        <div class="panel shadow-sm mb-3" id="control-bar">
            <div class="control-row" id="toolbar-row">
                <div class="control-group">
                    <span class="control-label">Date Type</span>
                    <div class="lens-toggle" id="lens-toggle">
                        <button data-lens="orders" class="active">Order Date</button>
                        <button data-lens="deliveries">Delivery Date</button>
                    </div>
                </div>
                <div class="control-group">
                    <span class="control-label">Group by</span>
                    <div class="lens-toggle" id="granularity-toggle">
                        <button data-granularity="week" class="active">By Week</button>
                        <button data-granularity="month">By Month</button>
                    </div>
                </div>
                <div class="control-group">
                    <span class="control-label">View</span>
                    <div class="lens-toggle" id="view-toggle">
                        <button data-view="summary" class="active">Summary</button>
                        <button data-view="vehicle">Vehicle</button>
                    </div>
                    <button class="btn btn-apply loading" id="apply-btn" onclick="applyFilters()" title="Apply the selected filters below">
                        <span id="apply-label"><i class="fas fa-spinner fa-spin"></i> Loading</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Slicer bar: full-width, one panel per dimension, multi-select,
             cross-filtering. Built by JS from the loaded rows. The bar
             already has 6px of padding-bottom (scrollbar clearance), so its
             own bottom margin is trimmed by that much — keeps the visible
             gap to the summary table equal to the gap above the filters
             (which has no such padding). -->
        <div id="slicer-bar" class="slicer-bar" style="margin-bottom: 10px;"></div>

        <!-- Summary View body: one table per dimension, stacked. Starts at the
             loading-spinner width (full, matching the control bar above) —
             renderSummary() removes is-loading once real tables are in, which
             lets the fit-content rule below take over and hug the content. -->
        <div class="panel shadow-sm is-loading" id="summary-area" style="max-width: 100%;">
            <div class="spinner-wrap"><div class="css-spinner"></div><div style="margin-top:12px;font-size:0.9rem;">Loading vehicles...</div></div>
        </div>

        <!-- Vehicle View body (the grid). The CSV button lives in here rather
             than the control bar because it exports the vehicle grid — sitting
             inside #vehicle-area means it is shown and hidden with the view
             itself, with no separate visibility handling. -->
        <div class="panel shadow-sm" id="vehicle-area" style="display:none;">
            <div class="d-flex justify-content-end align-items-center gap-2 mb-2">
                <!-- Resizes the vehicle grid only — the page-wide resizer at the
                     top of the page deliberately leaves this table alone. -->
                <div class="d-flex align-items-center gap-1">
                    <span class="small text-muted">Table font</span>
                    <button class="btn btn-outline-secondary btn-sm px-2 py-0" onclick="changeFont('vehicle', -1)">&minus;</button>
                    <span id="vehicle-font-size-label" class="small text-muted" style="min-width:32px;text-align:center">{{ font_vehicle }}</span>
                    <button class="btn btn-outline-secondary btn-sm px-2 py-0" onclick="changeFont('vehicle', 1)">+</button>
                    <button class="btn btn-outline-secondary btn-sm px-2 py-0" title="Reset font size" onclick="resetFont('vehicle')"><i class="fas fa-rotate-left"></i></button>
                </div>
                <button class="btn btn-csv" onclick="downloadCsv()"><i class="fas fa-download"></i> CSV</button>
            </div>
            <div id="grid-area">
                <div class="spinner-wrap"><div class="css-spinner"></div><div style="margin-top:12px;font-size:0.9rem;">Loading vehicles...</div></div>
            </div>
        </div>
    </div>

    <!-- shadeScale()/shadeColour() — shared with the other report pages so the
         red/amber/green scale stays identical everywhere. -->
    <script src="{{ static_url('js/shading.js') }}"></script>
    <script>
        const BASE_URL = "{{ BASE_URL }}";

        // Column definitions: key -> {label, type}
        // type: 'text' | 'num' | 'money' | 'pct' | 'date' | 'link' (link uses linkKey)
        const COLS = [
            { key: 'vrm', label: 'VRM' },
            { key: 'order_date', label: 'Order Date', type: 'date' },
            { key: 'delivered', label: 'Delivered', type: 'date' },
            // Make, model and derivative in one column — built by vehicleDesc()
            // (declared below; only called at render time, so order is fine).
            { key: 'description', label: 'Description', derived: r => vehicleDesc(r) },
            { key: 'supplier', label: 'Supplier' },
            { key: 'ack_dis', label: 'DIS', type: 'num',
              info: 'Days In Stock — purchase date to acknowledged date' },
            { key: 'dis_band', label: 'DIS Band' },
            { key: 'dts', label: 'DTS', type: 'num' },
            { key: 'purch_price', label: 'Purch', type: 'money' },
            { key: 'sell_price_incl_fee', label: 'Sell', type: 'money',
              info: 'Selling price before discount, including the admin fee actually charged on the deal' },
            { key: 'price_band', label: 'Price Band' },
            { key: 'discount', label: 'Discount', type: 'money' },
            { key: 'finance_subsidy', label: 'Finance Subsidy', type: 'money' },
            { key: 'chassis_mgn_aft_subs', label: 'Chassis', type: 'money',
              info: 'Chassis margin — sale price minus purchase price, discount and VAT cost, plus admin fee margin, after finance subsidy' },
            { key: 'vehicle_costs', label: 'Costs', type: 'money' },
            { key: 'write_down', label: 'Write Down', type: 'money' },
            { key: 'metal_mgn', label: 'Metal', type: 'money' },
            { key: 'gpu_m_costs', label: 'GPU-M Costs', type: 'money' },
            { key: 'gpu_m', label: 'GPU-M', type: 'money' },
            { key: 'at_val_order', label: 'AT Valuation', type: 'money' },
            { key: 'sell_pct_at', label: 'PTM %', type: 'pct',
              info: 'Price To Market — selling price including admin fee as a percentage of the Autotrader market valuation' },
            { key: 'at_rating', label: 'AT Rating', type: 'num' },
            { key: 'finance_comm', label: 'Finance Comm', type: 'money' },
            { key: 'product_mgn', label: 'Product Mgn', type: 'money' },
            { key: 'gpu_s_costs', label: 'GPU-S Costs', type: 'money' },
            { key: 'gpu_s', label: 'GPU-S', type: 'money' },
            { key: 'gpu_ms', label: 'GPU-MS', type: 'money' },
            { key: 'purchase_cap_pct', label: 'Purchase CAP %', type: 'pct' },
            { key: 'fuel', label: 'Fuel' },
            { key: 'colour', label: 'Colour' },
            { key: 'mileage', label: 'Mileage', type: 'num' },
            { key: 'mileage_band', label: 'Mileage Band' },
            { key: 'dfr', label: 'DFR', type: 'date' },
            { key: 'age_band', label: 'Age Band' },
            { key: 'supplier_channel', label: 'Supplier Channel' },
            { key: 'site', label: 'Site' },
            { key: 'sales_type', label: 'Sales Type' },
            { key: 'cap_live_purchase', label: 'CAP Live at Purchase', type: 'money' },
            { key: 'cap_live_order', label: 'CAP Live at Order', type: 'money' },
            { key: 'order_url', label: 'Order', type: 'link' },
            { key: 'invoice_url', label: 'Invoice', type: 'link' },
        ];

        // Lens config: which date field drives filtering/labels, and which
        // deal statuses are kept. Mirrors the two Power Query variants.
        const LENS = {
            orders:     { dateKey: 'order_date', label: 'Order date',    statuses: ['Acknowledged', 'Delivered'],
                          periodKeys: { week: 'order_week',     month: 'order_month' } },
            deliveries: { dateKey: 'delivered',  label: 'Delivery date', statuses: ['Delivered'],
                          periodKeys: { week: 'delivered_week', month: 'delivered_month' } },
        };

        let allRows = [];
        // Every control on the page — Lens, View, Group By, and all slicer
        // selections — is staged: clicking updates only the *Pending copy and
        // the button's own visual active state. Nothing about what's actually
        // displayed (rerender(), which reads the *Applied values) changes
        // until Apply is clicked, which copies every Pending value across.
        let lensApplied = 'orders', lensPending = 'orders';
        let viewApplied = 'summary', viewPending = 'summary';
        let granularityApplied = 'week', granularityPending = 'week';
        let sortKey = null, sortDir = 1;

        // ── Slicers ─────────────────────────────────────────────────────────
        // One panel per dimension, in display order. `key` is the row field;
        // 'period' is a synthetic key (Delivery/Order month) that follows the
        // lens. Selections are multi-select and cross-filter each other.
        const SLICERS = [
            { key: 'period',           label: 'Period' },
            { key: 'supplier_channel', label: 'Supplier Channel' },
            { key: 'supplier',         label: 'Supplier' },
            { key: 'sales_type',       label: 'Sales Type' },
            { key: 'fuel',             label: 'Fuel' },
            { key: 'price_band',       label: 'Price Band (Rate/Cash)' },
            { key: 'mileage_band',     label: 'Mileage Band' },
            { key: 'age_band',         label: 'Age Band' },
        ];
        // Slicer selections are LIVE — clicking a value filters the tables and
        // grid immediately. Only the three top toggles (Lens, View, Group By)
        // are staged behind the Apply button.
        const slicerSel = {};
        SLICERS.forEach(s => { slicerSel[s.key] = new Set(); });

        // Local yyyy-mm-dd for a Date. NEVER use toISOString().slice(0,10)
        // for this — that converts to UTC, so a local midnight in a positive
        // timezone (e.g. UK summer, UTC+1) rolls back to the previous day,
        // shifting an ISO week's Monday onto the prior Sunday and computing
        // the WRONG (previous) week. This was why the current week wasn't
        // being selected by default.
        function ymdLocal(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // ISO week key (yyyy-Www) for a yyyy-mm-dd date string. The rows carry
        // their own week keys from Snowflake — this is only used to build the
        // contiguous list of periods for the slicer and the default selection,
        // both of which work from today's date rather than from a row.
        //
        // It must therefore produce keys IDENTICAL to the SQL ones, including
        // sales__c's rule of folding week 53 into week 1 (see
        // order_acknowledged_week). Without that fold, a late-December pill
        // would carry a key no row could ever match.
        function isoWeekKey(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            const target = new Date(d.getTime());
            const dayNum = (d.getDay() + 6) % 7;               // Mon=0..Sun=6
            target.setDate(target.getDate() - dayNum + 3);      // nearest Thursday
            const firstThursday = new Date(target.getFullYear(), 0, 4);
            const firstDayNum = (firstThursday.getDay() + 6) % 7;
            firstThursday.setDate(firstThursday.getDate() - firstDayNum + 3);
            let week = 1 + Math.round((target - firstThursday) / (7 * 86400000));
            if (week === 53) week = 1;                          // matches sales__c
            return `${target.getFullYear()}-W${String(week).padStart(2, '0')}`;
        }
        // Monday date (yyyy-mm-dd) for an ISO week key — used to sort weeks
        // chronologically and to compute the default selection.
        function isoWeekMonday(weekKey) {
            const [y, w] = weekKey.split('-W').map(Number);
            // Jan 4 is always in ISO week 1 — move it to that week's Thursday
            // first (same nearest-Thursday adjustment isoWeekKey uses), THEN
            // step back 3 days to Monday. Using Jan 4's own weekday directly
            // (without this adjustment) is off by however many days Jan 4
            // sits from the nearest Thursday — e.g. in 2026 (Jan 4 = Sunday)
            // it produced Monday = 30 Dec 2025 instead of the correct 29 Dec.
            const jan4 = new Date(y, 0, 4);
            const jan4DayNum = (jan4.getDay() + 6) % 7;       // Mon=0..Sun=6
            const week1Thursday = new Date(jan4);
            week1Thursday.setDate(jan4.getDate() - jan4DayNum + 3);
            const week1Monday = new Date(week1Thursday);
            week1Monday.setDate(week1Thursday.getDate() - 3);
            const monday = new Date(week1Monday);
            monday.setDate(week1Monday.getDate() + (w - 1) * 7);
            return monday;
        }

        const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        // Human display label for a period key, e.g. "W30 20-Jul" for a week
        // key or "Jul 2026" for a month key. The raw key (yyyy-Www / yyyy-MM)
        // stays the actual filtering value everywhere — this is display only.
        function periodDisplayLabel(key) {
            if (/^\d{4}-W\d{2}$/.test(key)) {
                const monday = isoWeekMonday(key);
                const weekNum = key.split('-W')[1];
                return `W${weekNum} ${monday.getDate()}-${MONTH_ABBR[monday.getMonth()]}`;
            }
            if (/^\d{4}-\d{2}$/.test(key)) {
                const [y, m] = key.split('-').map(Number);
                return `${MONTH_ABBR[m - 1]} ${y}`;
            }
            return key;   // '(blank)' or anything unrecognised
        }

        // The period follows both the lens (which date drives it) and the
        // granularity toggle (week vs month). Takes lens/granularity explicitly
        // — callers pass the Applied pair for real data, the Pending pair for
        // the slicer panels' live preview of what's being staged.
        // Reads the period key straight off the row — the four keys (order/
        // delivery x week/month) are built in sales_performance__p, so nothing
        // is recomputed here on every render. Format is unchanged from what the
        // client used to produce: 'yyyy-Www' and 'yyyy-MM'.
        function periodOf(r, lensVal, granularityVal) {
            return r[LENS[lensVal].periodKeys[granularityVal]] || null;
        }
        // Sales type is bucketed for slicing — any rate/cash finance is one
        // "Rate/Cash" option, interest-free is "0%". The split is built in
        // sales_performance__p as SALES_TYPE_BUCKET rather than derived here,
        // so it is not recomputed for every row on every slicer click.
        function slicerValue(r, key, lensVal, granularityVal) {
            if (key === 'period') return periodOf(r, lensVal, granularityVal);
            if (key === 'sales_type') return r.sales_type_bucket;
            return r[key];
        }
        // Normalise a slicer value to a trimmed string, or '' if empty/blank —
        // so blank supplier/band values don't become empty pills.
        function normVal(v) {
            if (v == null) return '';
            return String(v).trim();
        }

        // Explicit display order for slicers where alphabetical is wrong.
        const SLICER_ORDER = {
            sales_type: ['Rate/Cash', '0%', 'Unknown'],
            fuel: ['Petrol', 'Diesel', 'Electric', 'Hybrid', 'Plug-In Hybrid'],
        };
        // Heading reflects APPLIED lens/granularity — frozen until Apply,
        // same as everything else in the slicer bar.
        function slicerHeadingApplied(key) {
            if (key === 'period') {
                const noun = granularityApplied === 'week' ? 'Week' : 'Month';
                return (lensApplied === 'deliveries' ? 'Delivery ' : 'Order ') + noun;
            }
            return SLICERS.find(s => s.key === key).label;
        }

        // ── Font resizers (persisted per user in Aurora via /api/user-prefs) ──
        // Two independent controls:
        //   'page'    — everything except the vehicle grid. Sets --page-font on
        //               <body>, so every em-sized rule on the page follows it.
        //   'vehicle' — the vehicle grid only, resized from its own buttons
        //               next to that table's CSV button.
        // The pref keys are unchanged from when these were the summary/vehicle
        // sizes, so an existing saved preference still applies.
        // Defaults mirror _FONT_DEFAULT / _FONT_DEFAULT_VEHICLE in
        // orders_deliveries.py — keep the two in step.
        const FONT_MIN = 8, FONT_MAX = 20, FONT_DEFAULT = 13;
        const FONT_CONFIG = {
            page:    { prefKey: 'orders_deliveries_font_summary', cssVar: '--page-font',    labelId: 'font-size-label',         fallback: 13 },
            vehicle: { prefKey: 'orders_deliveries_font_vehicle', cssVar: '--vehicle-font', labelId: 'vehicle-font-size-label', fallback: 12 },
        };
        // Seeded from the server-rendered values (see :root and the labels'
        // initial text above) so this matches first paint exactly — loadFont()
        // still confirms against Aurora, but has nothing left to visibly change.
        const fontSizes = { page: {{ font_summary }}, vehicle: {{ font_vehicle }} };
        const fontSaveTimers = {};

        function applyFont(which) {
            document.documentElement.style.setProperty(FONT_CONFIG[which].cssVar, fontSizes[which] + 'px');
            const label = document.getElementById(FONT_CONFIG[which].labelId);
            if (label) label.textContent = fontSizes[which];

            // Both tables size their columns by MEASURING text at the current
            // font (measureSummaryLabelWidth / measureVehicleColumnWidths), so a
            // font change needs a re-render, not just a CSS variable swap —
            // otherwise the columns keep their old widths and the filter panels
            // and control bar no longer line up with the summary card's edge.
            // Guarded on allRows so this does nothing during the initial load,
            // when loadFont() runs before any data has arrived.
            if (!allRows.length) return;
            if (which === 'page' && viewApplied === 'summary') renderSummary();
            if (which === 'vehicle' && viewApplied === 'vehicle') renderGrid();
        }

        function changeFont(which, delta) {
            fontSizes[which] = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSizes[which] + delta));
            applyFont(which);
            // Debounced save so rapid clicks don't spam Aurora
            clearTimeout(fontSaveTimers[which]);
            fontSaveTimers[which] = setTimeout(() => saveFont(which), 500);
        }

        function resetFont(which) {
            fontSizes[which] = FONT_CONFIG[which].fallback;
            applyFont(which);
            clearTimeout(fontSaveTimers[which]);
            fontSaveTimers[which] = setTimeout(() => saveFont(which), 500);
        }

        async function saveFont(which) {
            try {
                await fetch(BASE_URL + '/api/user-prefs/' + FONT_CONFIG[which].prefKey, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fontSizes[which]),
                });
            } catch (e) { /* non-fatal — font just won't persist this time */ }
        }

        async function loadFont() {
            await Promise.all(Object.keys(FONT_CONFIG).map(async which => {
                try {
                    const resp = await fetch(BASE_URL + '/api/user-prefs/' + FONT_CONFIG[which].prefKey);
                    if (resp.ok) {
                        const data = await resp.json();
                        const v = Number(data.value);
                        if (Number.isFinite(v) && v >= FONT_MIN && v <= FONT_MAX) fontSizes[which] = v;
                    }
                } catch (e) { /* fall back to default */ }
                applyFont(which);
            }));
        }

        function fmtMoney(v) {
            if (v === null || v === undefined || v === '') return '';
            const n = Math.round(Number(v));
            return '£' + n.toLocaleString('en-GB');
        }
        function fmtNum(v) {
            if (v === null || v === undefined || v === '') return '';
            return Number(v).toLocaleString('en-GB');
        }
        function fmtPct(v) {
            if (v === null || v === undefined || v === '') return '';
            return (Number(v) * 100).toFixed(1) + '%';
        }
        // ISO 'yyyy-MM-dd' (what the API sends) -> 'dd/MM/yyyy'. Split on the
        // string rather than going through new Date(): a bare ISO date is
        // parsed as UTC, so formatting it back in a UK summer timezone can
        // land on the previous day.
        function fmtDate(v) {
            if (v === null || v === undefined || v === '') return '';
            const m = String(v).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
            return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v);
        }
        function fmtCell(col, v) {
            // AT Rating comes through with decimals (e.g. 73.64) but is shown
            // as a whole number everywhere — rounded before fmtNum's own
            // formatting rather than given its own 'type', since every other
            // num column on this page genuinely wants fmtNum as-is.
            if (col.key === 'at_rating') return fmtNum(v === null || v === undefined || v === '' ? v : Math.round(Number(v)));
            switch (col.type) {
                case 'money': return fmtMoney(v);
                case 'num':   return fmtNum(v);
                case 'pct':   return fmtPct(v);
                case 'date':  return fmtDate(v);
                default:      return (v === null || v === undefined) ? '' : String(v);
            }
        }
        function isNeg(col, v) {
            return (col.type === 'money' || col.type === 'pct') && v !== null && v !== undefined && Number(v) < 0;
        }

        function escapeHtml(s) {
            const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
        }

        // Layer 1 — lens only (no slicers, no period). Everything downstream
        // (slicers, summary, grid) starts from this set. The date window
        // itself is just the Period slicer's selection, applied later via
        // passesSlicers like any other slicer.
        function baseRows(lensVal) {
            const cfg = LENS[lensVal];
            return allRows.filter(r => cfg.statuses.includes(r.deal_status) && !!r[cfg.dateKey]);
        }

        // Does a row pass all slicer selections in the given selection map,
        // optionally ignoring one panel (used so a panel's own values aren't
        // excluded by its own selection — that's what makes the cross-
        // filtering feel right).
        //
        // Always called with the APPLIED selection map + lensApplied/
        // granularityApplied — nothing on screen reflects a Pending value
        // until Apply is clicked.
        function passesSlicers(r, sel_map, lensVal, granularityVal, exceptKey) {
            for (const s of SLICERS) {
                if (s.key === exceptKey) continue;
                const sel = sel_map[s.key];
                // An empty selection means "no filter — show every row" for
                // every slicer EXCEPT Period. Weeks/months span the whole
                // history the page can hold, so an empty Period would load
                // every row ever seen instead of nothing — the opposite of
                // what Clear is for. So an empty Period matches NO rows: the
                // one case where the reverse of every other slicer is what
                // "too much data" actually needs.
                if (sel.size === 0) {
                    if (s.key === 'period') return false;
                    continue;
                }
                const v = normVal(slicerValue(r, s.key, lensVal, granularityVal));
                if (!v || !sel.has(v)) return false;
            }
            return true;
        }

        // Layer 2 — base rows that pass every (live) slicer. This is the
        // working set used by the summary tables, the grid, and the row count.
        function filteredRows() {
            return baseRows(lensApplied).filter(r => passesSlicers(r, slicerSel, lensApplied, granularityApplied));
        }

        // A column's value for one row. Derived columns (Description) build
        // theirs from several fields; everything else reads the row directly.
        // Used by the grid's sort, render, column measuring and CSV export, so
        // they all agree on what a column contains.
        function cellValue(col, r) {
            return col && col.derived ? col.derived(r) : r[col.key];
        }

        // The vehicle grid: filtered rows, sorted.
        function visibleRows() {
            const rows = filteredRows();
            if (sortKey) {
                const col = COLS.find(c => c.key === sortKey);
                const numeric = col && (col.type === 'num' || col.type === 'money' || col.type === 'pct');
                rows.sort((a, b) => {
                    let av = cellValue(col, a), bv = cellValue(col, b);
                    if (av == null) return 1; if (bv == null) return -1;
                    if (numeric) { av = Number(av); bv = Number(bv); return (av - bv) * sortDir; }
                    return String(av).localeCompare(String(bv)) * sortDir;
                });
            }
            return rows;
        }

        // ── Summary tables ───────────────────────────────────────────────────
        // One table per dimension, stacked. Each row = mean/sum over the rows
        // in that group; Grand Total = the same aggregation over every row in
        // the table (i.e. the filtered set the table is built from).
        const SUMMARY_COLS = [
            { key: 'units',        label: 'Units',              agg: 'count' },
            { key: 'units_pct',    label: 'Units %',            agg: 'pct_of_total' },
            { key: 'ack_dis',      label: 'DIS',                 agg: 'mean',
              info: 'Days In Stock — purchase date to acknowledged date' },
            { key: 'purch_price',  label: 'Purch',               agg: 'mean', money: true },
            { key: 'sell_price_incl_fee', label: 'Sell',       agg: 'mean', money: true,
              info: 'Selling price before discount, including the admin fee actually charged on the deal' },
            { key: 'discount',     label: 'Discount',            agg: 'mean', money: true },
            { key: 'chassis_mgn_aft_subs',  label: 'Chassis',    agg: 'mean', money: true,
              info: 'Chassis margin — sale price minus purchase price, discount and VAT cost, plus admin fee margin, after finance subsidy' },
            { key: 'vehicle_costs', label: 'Costs',              agg: 'mean', money: true },
            { key: 'metal_mgn',    label: 'Metal',               agg: 'mean', money: true },
            { key: 'gpu_m',        label: 'GPU-M',               agg: 'mean', money: true },
            { key: 'at_val_order', label: 'AT Valuation',        agg: 'mean', money: true },
            { key: 'sell_pct_at',  label: 'PTM %',               agg: 'mean',
              info: 'Price To Market — selling price including admin fee as a percentage of the Autotrader market valuation' },
            { key: 'at_rating',    label: 'AT Rating',           agg: 'mean' },
            { key: 'fin_pen_pct',  label: 'Fin Pen %',           agg: 'fin_pen_pct' },
            { key: 'fin_comm_all', label: 'Fin Comm',            agg: 'fin_comm_all', money: true },
            { key: 'fin_comm_fin', label: 'Fin Comm / unit',     agg: 'fin_comm_financed', money: true },
            { key: 'product_mgn',  label: 'Product Mgn',         agg: 'mean', money: true },
            { key: 'gpu_s',        label: 'GPU-S',               agg: 'mean', money: true },
            { key: 'gpu_ms',       label: 'GPU-MS',              agg: 'mean', money: true },
        ];
        // Columns shaded per-column (relative min->max within the table, red to
        // yellow to green — same scale as the buying requirements page).
        // 'green' = higher is better; 'red' = higher is worse (DIS — longer in
        // stock is bad). Finance/product-related columns (Fin Pen %, Fin Comm,
        // Fin Comm/unit, Prod mgn) are deliberately NOT shaded.
        // 'red' on vehicle_costs because this table stores costs as POSITIVE
        // numbers (unlike the VSE cost columns, which are already negative) —
        // so a high value here is a high cost, i.e. bad.
        const SHADE_DIRECTION = {
            ack_dis: 'red', vehicle_costs: 'red',
            chassis_mgn_aft_subs: 'green', gpu_m: 'green', gpu_ms: 'green',
            at_rating: 'green',
        };
        const SHADE_COLS = new Set(Object.keys(SHADE_DIRECTION));

        // Values that decide a column's min/max. Day counts over a year are
        // data problems (a vehicle never marked sold, a bad purchase date), not
        // genuinely slow stock — left in, a single 900-day row stretches the
        // scale so far that every real value lands near the good end and the
        // column reads uniformly green. Anomalies still get a colour; they just
        // sit at the red end instead of defining where it is.
        const DAY_COUNT_MAX = 365;
        const withinYear = v => v <= DAY_COUNT_MAX;
        const SHADE_IN_SCALE = {
            ack_dis: withinYear,
            dts: withinYear,
        };

        function mean(vals) {
            const known = vals.filter(v => v !== null && v !== undefined && v !== '' && !Number.isNaN(Number(v))).map(Number);
            if (!known.length) return null;
            return known.reduce((a, b) => a + b, 0) / known.length;
        }

        // Build one summary row (a group's rows -> the 16 column values).
        function summariseGroup(rows, totalUnits) {
            const out = { units: rows.length };
            out.units_pct = totalUnits ? rows.length / totalUnits : null;
            out.ack_dis = mean(rows.map(r => r.ack_dis));
            out.purch_price = mean(rows.map(r => r.purch_price));
            out.sell_price_incl_fee = mean(rows.map(r => r.sell_price_incl_fee));
            out.discount = mean(rows.map(r => r.discount));
            out.chassis_mgn_aft_subs = mean(rows.map(r => r.chassis_mgn_aft_subs));
            out.vehicle_costs = mean(rows.map(r => r.vehicle_costs));
            out.metal_mgn = mean(rows.map(r => r.metal_mgn));
            out.gpu_m = mean(rows.map(r => r.gpu_m));
            out.at_val_order = mean(rows.map(r => r.at_val_order));
            // Ratio of the two averages shown alongside it (Sell / AT
            // Valuation), NOT a mean of each vehicle's own %. An average of
            // per-vehicle ratios can land far from what the two adjacent
            // columns divide to — a handful of low-value vehicles with an
            // unusual % barely move the two £ averages but swing their own
            // average heavily. Both averages are restricted to vehicles that
            // have BOTH figures, so the numerator and denominator are means
            // over the same set of rows and the on-screen division is exact.
            // Vehicles missing an AT valuation (no listing found) are excluded
            // from both, same as they already were from at_val_order's own
            // average.
            {
                const withBoth = rows.filter(r =>
                    r.sell_price_incl_fee !== null && r.sell_price_incl_fee !== undefined &&
                    r.at_val_order !== null && r.at_val_order !== undefined);
                const sellOverBoth = mean(withBoth.map(r => r.sell_price_incl_fee));
                const atValOverBoth = mean(withBoth.map(r => r.at_val_order));
                out.sell_pct_at = atValOverBoth ? sellOverBoth / atValOverBoth : null;
            }
            out.at_rating = mean(rows.map(r => r.at_rating));
            out.product_mgn = mean(rows.map(r => r.product_mgn));
            out.gpu_s = mean(rows.map(r => r.gpu_s));
            out.gpu_ms = mean(rows.map(r => r.gpu_ms));

            // Fin Pen % = units on Rate finance / all units in the row
            // (0% and Cash both excluded from the numerator)
            const rateUnits = rows.filter(r => String(r.sales_type || '').trim().toLowerCase() === 'rate').length;
            out.fin_pen_pct = rows.length ? rateUnits / rows.length : null;

            // Avg Fin Comm = total commission / ALL units; Avg Fin Comm/unit =
            // total commission / units that actually earned commission.
            const commVals = rows.map(r => Number(r.finance_comm)).filter(v => !Number.isNaN(v));
            const commTotal = commVals.reduce((a, b) => a + b, 0);
            const financedCount = rows.filter(r => Number(r.finance_comm) > 0).length;
            out.fin_comm_all = rows.length ? commTotal / rows.length : null;
            out.fin_comm_fin = financedCount ? commTotal / financedCount : null;

            return out;
        }

        // Build a full summary table for one dimension: { key, heading, rows: [{label, ...cols}], total }
        // Full vehicle description: make/model plus derivative. Either part can
        // be blank, so they're joined only when both are present — otherwise a
        // missing derivative would leave a trailing space.
        function vehicleDesc(r) {
            return [r.make_model, r.derivative].map(v => normVal(v)).filter(Boolean).join(' ');
        }

        // The popup shows exactly the Vehicle view's columns, in the same
        // order — it IS COLS, not a copy or a subset. Anything added, removed
        // or reordered in COLS lands in both views automatically, and there is
        // no second list to keep in step. (It used to stop at GPU-MS and layer
        // on its own info text; both of those were sources of drift.)
        const MODAL_COLS = COLS;

        // Sentinel used as the View button's data-label on a Grand Total row —
        // no real group label can collide with it because group labels come
        // from row values, and '(blank)' is used for empty ones.
        const GRAND_TOTAL_LABEL = '__grand_total__';

        function buildSummaryTable(rows, groupKey, heading, order, dimKey) {
            const groups = new Map();
            rows.forEach(r => {
                const v = normVal(r[groupKey]) || '(blank)';
                if (!groups.has(v)) groups.set(v, []);
                groups.get(v).push(r);
            });
            let labels = [...groups.keys()];
            labels = order
                ? labels.sort((a, b) => {
                    const ia = order.indexOf(a), ib = order.indexOf(b);
                    if (ia === -1 && ib === -1) return String(a).localeCompare(String(b));
                    if (ia === -1) return 1; if (ib === -1) return -1;
                    return ia - ib;
                })
                : labels.sort((a, b) => String(a).localeCompare(String(b), 'en', { numeric: true }));

            const total = rows.length;
            const dataRows = labels.map(label => ({ label, ...summariseGroup(groups.get(label), total) }));
            const totalRow = { label: 'Grand Total', ...summariseGroup(rows, total) };
            return { heading, rows: dataRows, totalRow, groupKey, dimKey: dimKey || groupKey };
        }

        // Per-column shading, scaled to that column's own min..max across the
        // rows being drawn. The scale itself (colours, interpolation) lives in
        // shading.js so every page shades identically; these two wrap it for
        // this page's "build a shader per column key, emit an HTML attribute"
        // rendering style.
        function columnShader(dataRows, key) {
            return shadeScale(dataRows, r => r[key], { inScale: SHADE_IN_SCALE[key] });
        }
        // Returns a ready-to-inline style attribute (or '' when not shadeable).
        function shadeAttr(shader, value, direction) {
            if (!shader) return '';
            const colour = shader(value, direction === 'red' ? 'high-bad' : 'high-good');
            return colour ? ` style="background: ${colour}"` : '';
        }

        function fmtSummaryCell(col, v) {
            if (v === null || v === undefined) return '';
            if (col.key === 'units') return Math.round(v).toLocaleString('en-GB');
            if (col.key === 'ack_dis') return Number(v).toFixed(1);
            if (col.key === 'at_rating') return Number(v).toFixed(0);
            if (col.money) return fmtMoney(v);
            return fmtPct(v);   // units_pct, fin_pen_pct
        }

        // Fixed column widths shared by every summary table, so they all line
        // up vertically regardless of which dimension is shown. The label
        // column width is measured (not guessed) from the actual longest
        // heading/label text that will appear across all seven tables — see
        // measureSummaryLabelWidth(). The table renders at its own natural
        // best fit — nothing stretches it, and nothing is sized from it
        // either: the filter panels above are a fixed width independent of
        // this table and of which view is showing.
        const SUMMARY_DATA_COL_WIDTH_BASE = 66;
        // The View column sits immediately after Units. It holds a fixed-size
        // button, so it gets its own fixed width rather than the shared data
        // column width — and it's excluded from every aggregation/shading path.
        const SUMMARY_VIEW_COL_WIDTH = 52;
        const VIEW_COL_AFTER = 'units';   // View column is rendered after this column
        const SUMMARY_LABEL_PADDING = 20;   // matches the cell's left+right padding
        let summaryLabelColWidth = 95;        // recomputed before each render
        let summaryDataColWidth = SUMMARY_DATA_COL_WIDTH_BASE;

        // Filter panel width — matches the .slicer CSS fallback and
        // #control-bar's pre-JS fallback width. This is the width the panels
        // always render at, in both views; the control bar is measured to
        // match them rather than the other way round.
        const SLICER_WIDTH_BASE = 163;

        // Measure the pixel width of the longest label-column text (every
        // table heading + every row/Grand Total label) using the real font,
        // so the column is exactly as wide as it needs to be — no guessing.
        function measureSummaryLabelWidth(tables) {
            const canvas = measureSummaryLabelWidth._canvas || (measureSummaryLabelWidth._canvas = document.createElement('canvas'));
            const ctx = canvas.getContext('2d');
            const size = getComputedStyle(document.documentElement).getPropertyValue('--page-font').trim() || '11px';
            ctx.font = `600 ${size} 'DM Sans', system-ui, sans-serif`;   // bold, matches .dim-label/.total-row weight
            let max = 0;
            tables.forEach(t => {
                const displayLabel = l => t.groupKey === '__period' ? periodDisplayLabel(l) : l;
                max = Math.max(max, ctx.measureText(t.heading).width);
                t.rows.forEach(r => { max = Math.max(max, ctx.measureText(displayLabel(r.label)).width); });
                max = Math.max(max, ctx.measureText(t.totalRow.label).width);
            });
            return Math.ceil(max) + SUMMARY_LABEL_PADDING;
        }

        function summaryColgroupHtml() {
            const cols = [`<col style="width:${summaryLabelColWidth}px">`];
            SUMMARY_COLS.forEach(c => {
                cols.push(`<col style="width:${summaryDataColWidth}px">`);
                if (c.key === VIEW_COL_AFTER) cols.push(`<col style="width:${SUMMARY_VIEW_COL_WIDTH}px">`);
            });
            return `<colgroup>${cols.join('')}</colgroup>`;
        }

        // Small "i" marker after a column heading. The explanation is rendered
        // from data-info by a CSS tooltip (see theme.css) rather than the
        // browser's `title`, which cannot be styled and waits ~1s before
        // showing. Deliberately NOT title — setting both shows two tooltips.
        function infoMarkHtml(col) {
            if (!col.info) return '';
            return ` <span class="info-mark" data-info="${escapeHtml(col.info)}">i</span>`;
        }

        function renderSummaryTableHtml(table) {
            const shaders = {};
            // Sales Type only ever has 2-3 rows (Rate/Cash, 0%, Unknown) — a
            // min->max shade over that few rows just marks "biggest of three",
            // not a meaningful spread, so it is left unshaded.
            if (table.dimKey !== '__sales_type_bucket') {
                SHADE_COLS.forEach(k => { shaders[k] = columnShader(table.rows, k); });
            }

            const head = `<tr><th>${escapeHtml(table.heading)}</th>` +
                SUMMARY_COLS.map(c => {
                    // title only when there is no info marker — otherwise the
                    // browser tooltip and the marker's own would both appear.
                    const t = c.info ? '' : ` title="${escapeHtml(c.label)}"`;
                    const th = `<th class="num"${t}>${escapeHtml(c.label)}${infoMarkHtml(c)}</th>`;
                    return c.key === VIEW_COL_AFTER ? th + '<th>View</th>' : th;
                }).join('') + '</tr>';

            // The button carries the group's identity (which table, which row
            // label) so the popup can rebuild exactly the rows that produced
            // the Units figure next to it.
            const viewCellHtml = label =>
                `<td class="view-cell"><button type="button" class="btn-view" data-dim="${escapeHtml(table.dimKey)}" data-label="${escapeHtml(label)}">View</button></td>`;

            // Period rows show a friendly label (e.g. "W30 20-Jul"); the raw
            // key (r.label) is only used internally for grouping/sorting.
            const displayLabel = l => table.groupKey === '__period' ? periodDisplayLabel(l) : l;

            const rowHtml = r => {
                const cells = SUMMARY_COLS.map(c => {
                    const v = r[c.key];
                    const negCls = (typeof v === 'number' && v < 0) ? ' neg' : '';
                    const td = `<td class="num${negCls}"${shadeAttr(shaders[c.key], v, SHADE_DIRECTION[c.key])}>${escapeHtml(fmtSummaryCell(c, v))}</td>`;
                    return c.key === VIEW_COL_AFTER ? td + viewCellHtml(r.label) : td;
                }).join('');
                return `<tr><td class="dim-label">${escapeHtml(displayLabel(r.label))}</td>${cells}</tr>`;
            };

            const totalCells = SUMMARY_COLS.map(c => {
                const v = table.totalRow[c.key];
                const negCls = (typeof v === 'number' && v < 0) ? ' neg' : '';
                const td = `<td class="num${negCls}">${escapeHtml(fmtSummaryCell(c, v))}</td>`;
                return c.key === VIEW_COL_AFTER ? td + viewCellHtml(GRAND_TOTAL_LABEL) : td;
            }).join('');
            const totalHtml = `<tr class="total-row"><td class="dim-label">${escapeHtml(table.totalRow.label)}</td>${totalCells}</tr>`;

            return `<div class="summary-table-wrap"><table class="summary">
                ${summaryColgroupHtml()}
                <thead>${head}</thead>
                <tbody>${table.rows.map(rowHtml).join('')}${totalHtml}</tbody>
            </table></div>`;
        }

        // Dimensions and their column key + explicit ordering (undefined = alphabetical)
        const SUMMARY_DIMENSIONS = [
            { key: '__sales_type_bucket', heading: 'Sales Type', order: ['Rate/Cash', '0%', 'Unknown'], skipOwnFilter: true },
            { key: '__period', heading: null /* set per-lens */ },
            { key: 'supplier_channel', heading: 'Channel' },
            { key: 'fuel', heading: 'Fuel Type', order: SLICER_ORDER.fuel },
            { key: 'price_band', heading: 'Price Band (Rate/Cash)', order: ['<10k','10-12.5k','12.5-15k','15-20k','20-25k','25-30k','30k+','Interest Free'] },
            { key: 'mileage_band', heading: 'Mileage Band' },
            { key: 'age_band', heading: 'Age Band' },
        ];

        function renderSummary() {
            const area = document.getElementById('summary-area');
            const base = baseRows(lensApplied);                                                            // lens only, no slicers
            const filtered = base.filter(r => passesSlicers(r, slicerSel, lensApplied, granularityApplied)); // + all live slicers
            const filteredExceptSalesType = base.filter(r => passesSlicers(r, slicerSel, lensApplied, granularityApplied, 'sales_type'));

            // Pass 1: build every table's data (no HTML yet).
            const tables = SUMMARY_DIMENSIONS.map(dim => {
                let rows, groupKey, heading, order;
                if (dim.skipOwnFilter) {
                    // Groups straight off the column — no per-row object copy.
                    rows = filteredExceptSalesType;
                    groupKey = 'sales_type_bucket'; heading = dim.heading; order = dim.order;
                } else if (dim.key === '__period') {
                    rows = filtered.map(r => ({ ...r, __period: periodOf(r, lensApplied, granularityApplied) || '(blank)' }));
                    groupKey = '__period';
                    // Follows lens + granularity: "Order Week" / "Delivery Week"
                    // / "Order Month" / "Delivery Month" (same as the slicer).
                    heading = slicerHeadingApplied('period');
                    order = null; // yyyy-MM / yyyy-Www both sort chronologically as strings
                } else {
                    rows = filtered; groupKey = dim.key; heading = dim.heading; order = dim.order;
                }
                return buildSummaryTable(rows, groupKey, heading, order, dim.key);
            });

            // Measure the true longest label across every table's heading and
            // row labels (including Grand Total), so all seven tables share
            // one exact-fit label column width — no guessing, no truncation.
            // The label column itself is left at this natural width — it's
            // sized to fit specific text ("Rate/Cash", "Grand Total"), not
            // stretched like the data columns.
            summaryLabelColWidth = tables.length ? measureSummaryLabelWidth(tables) : summaryLabelColWidth;
            summaryDataColWidth = SUMMARY_DATA_COL_WIDTH_BASE;

            const emptyHtml = '<div class="empty-state">No rows match the current view.</div>';
            area.classList.remove('is-loading');   // let the fit-content width rule take over
            area.innerHTML = tables.map(renderSummaryTableHtml).join('') || emptyHtml;

            area.querySelectorAll('button.btn-view').forEach(btn => {
                btn.addEventListener('click', () =>
                    openVehicleModal(btn.dataset.dim, btn.dataset.label));
            });

            // The summary card sizes itself to its own content (fit-content).
            // The filter panels above are deliberately NOT tied to it — the
            // top section is a fixed width in both views, set once in
            // renderSlicers().
        }

        // ── Vehicle list popup ──────────────────────────────────────────────
        // Rebuilds the exact set of rows behind one summary cell's Units
        // figure, using the same filtering the table itself used, so the
        // popup's row count always equals the Units number next to the button.
        function rowsForSummaryGroup(dimKey, label) {
            const dim = SUMMARY_DIMENSIONS.find(d => d.key === dimKey);
            if (!dim) return [];
            const base = baseRows(lensApplied);
            // Sales Type's table ignores the Sales Type slicer (skipOwnFilter),
            // exactly as renderSummary() builds it.
            const rows = base.filter(r => passesSlicers(
                r, slicerSel, lensApplied, granularityApplied,
                dim.skipOwnFilter ? 'sales_type' : undefined));
            if (label === GRAND_TOTAL_LABEL) return rows;

            const valueOf = r => {
                if (dim.key === '__sales_type_bucket') return normVal(r.sales_type_bucket) || '(blank)';
                if (dim.key === '__period') return periodOf(r, lensApplied, granularityApplied) || '(blank)';
                return normVal(r[dim.key]) || '(blank)';
            };
            return rows.filter(r => valueOf(r) === label);
        }

        function closeVehicleModal() {
            document.getElementById('vehicle-modal-backdrop')?.remove();
            document.getElementById('vehicle-modal')?.remove();
            document.removeEventListener('keydown', vehicleModalKeydown);
        }
        function vehicleModalKeydown(e) { if (e.key === 'Escape') closeVehicleModal(); }

        // Sort state for the popup, independent of the vehicle grid's own.
        // Reset on each open so a popup always starts in Make Model order.
        let modalRows = [], modalSortKey = 'description', modalSortDir = 1;
