<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOT Check</title>
    <link rel="icon" type="image/png" href="{{ BASE_URL }}/static/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Regular.ttf'); font-weight: 400; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Medium.ttf'); font-weight: 500; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-SemiBold.ttf'); font-weight: 600; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Bold.ttf'); font-weight: 700; }

        body, button, input, select, textarea { font-family: 'DM Sans', system-ui, sans-serif; }
        body { background-color: #003c57; min-height: 100vh; }

        .page-wrap {
            min-height: 100vh;
            padding: 48px 32px 64px;
        }
        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
        }
        .page-title {
            color: #ffffff;
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: -0.2px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
        }
        .card-body { padding: 24px 28px; }

        textarea {
            resize: vertical;
            font-size: 0.88rem;
            font-family: 'DM Sans', monospace;
        }
        .btn-process {
            background-color: #7ed321;
            border: none;
            color: #0d3d5f;
            font-weight: 700;
            font-size: 1rem;
            padding: 11px 0;
            border-radius: 8px;
            width: 100%;
            transition: background 0.15s;
        }
        .btn-process:hover { background-color: #6cba18; color: #0d3d5f; }
        .btn-process:disabled { opacity: 0.6; cursor: not-allowed; }

        .progress { height: 8px; border-radius: 6px; }
        .progress-bar { background-color: #7ed321; }

        .history-empty { color: #adb5bd; font-size: 0.88rem; }
        .history-scroll { max-height: 260px; overflow-y: auto; overflow-x: auto; }
        .history-table { font-size: 0.82rem; width: 100%; }
        .history-table th { white-space: nowrap; background-color: #f0f4f8; font-weight: 600; padding: 7px 10px; position: sticky; top: 0; z-index: 1; }
        .history-table td { white-space: nowrap; padding: 7px 10px; border-top: 1px solid #f0f0f0; vertical-align: middle; }

        .logout-link {
            position: fixed;
            top: 18px;
            right: 22px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.55);
            text-decoration: none;
        }
        .logout-link:hover { color: #fff; }

        .status-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-valid   { background-color: #d4edda; color: #155724; }
        .badge-expired { background-color: #f8d7da; color: #721c24; }
        .badge-unknown { background-color: #e2e3e5; color: #383d41; }

        .result-table { font-size: 0.8rem; }
        .result-table th { white-space: nowrap; background-color: #f0f4f8; position: sticky; top: 0; z-index: 1; }
        .result-table td { white-space: nowrap; }
        .result-scroll { max-height: 380px; overflow-y: auto; overflow-x: auto; }
    </style>
</head>
<body>
    <a href="{{ BASE_URL }}/logout" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>

    <div class="page-wrap">
        <!-- Header -->
        <div class="d-flex align-items-center gap-3 mb-4">
            <img src="{{ BASE_URL }}/static/icon.png" alt="" class="brand-logo">
            <div>
                <a href="{{ BASE_URL }}/home" class="text-white-50 text-decoration-none small">
                    <i class="fas fa-arrow-left me-1"></i>Back
                </a>
                <h1 class="page-title mb-0">MOT Check</h1>
            </div>
        </div>

        <!-- Two-column layout -->
        <div class="row g-4 align-items-start">

            <!-- Left: input + progress -->
            <div class="col-12 col-lg-5 col-xl-4">
                <div class="card mb-3">
                    <div class="card-body">
                        <label class="form-label fw-bold small text-uppercase text-muted mb-1">VRMs (one per line)</label>
                        <textarea id="vrmInput" class="form-control mb-2" rows="14"></textarea>
                        <div class="text-muted small mb-3" id="vrmCount" style="display:none;">
                            <i class="fas fa-car me-1"></i><span id="countVal">0</span> vehicles
                        </div>
                        <button class="btn btn-process" id="processBtn" onclick="startProcessing()">
                            Run MOT Check
                        </button>
                    </div>
                </div>

                <!-- Progress -->
                <div class="card" id="progressCard" style="display:none;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="small text-muted">Processing...</span>
                            <span class="small text-muted" id="progressLabel">0%</span>
                        </div>
                        <div class="progress mb-2">
                            <div class="progress-bar" id="progressBar" style="width:0%"></div>
                        </div>
                        <div class="d-flex justify-content-between small text-muted">
                            <span id="progressRows">0 / 0</span>
                            <span id="progressEta">Calculating...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: history + results -->
            <div class="col-12 col-lg-7 col-xl-8">
                <div class="card mb-3" id="resultsCard" style="display:none;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0 fw-bold">Results</h6>
                            <button class="btn btn-sm btn-outline-secondary" onclick="downloadCsv()">
                                <i class="fas fa-download me-1"></i>Download XLSX
                            </button>
                        </div>
                        <div id="resultsSummary" class="mb-3" style="font-size:0.88rem;"></div>
                        <div class="result-scroll">
                            <table class="table table-sm table-hover result-table mb-0">
                                <thead><tr id="resultsHeader"></tr></thead>
                                <tbody id="resultsBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">Previous Tasks</h6>
                        <div class="history-scroll">
                            <table class="history-table" id="historyTable" style="display:none;">
                                <thead>
                                    <tr>
                                        <th>File Name</th>
                                        <th>Date &amp; Time</th>
                                        <th>User</th>
                                        <th>Size</th>
                                        <th># Vehicles</th>
                                        <th># Expired</th>
                                        <th># Not Found</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="historyBody"></tbody>
                            </table>
                            <p class="history-empty mb-0" id="historyEmpty">No previous runs found.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.BASE_URL = "{{ BASE_URL }}";
        let _currentFilename = null;

        const vrmInput = document.getElementById('vrmInput');
        vrmInput.addEventListener('input', () => {
            const n = parseVrms().length;
            document.getElementById('countVal').textContent = n;
            document.getElementById('vrmCount').style.display = n > 0 ? '' : 'none';
        });

        function parseVrms() {
            return vrmInput.value.split('\n')
                .map(v => v.trim().replace(/\s+/g, '').toUpperCase())
                .filter(v => v.length > 0);
        }

        function startProcessing() {
            const vrms = parseVrms();
            if (!vrms.length) { alert('Enter at least one VRM.'); return; }

            document.getElementById('processBtn').disabled = true;
            document.getElementById('progressCard').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            setProgress(0, 0, vrms.length, null);

            let pollInterval = setInterval(() => {
                fetch(BASE_URL + '/mot-check/progress')
                    .then(r => r.json())
                    .then(p => { if (p.total > 0) setProgress(p.pct, p.done, p.total, p.eta_s); })
                    .catch(() => {});
            }, 1000);

            fetch(BASE_URL + '/mot-check/process', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({vrms})
            })
            .then(r => {
                if (!r.ok) return r.json().then(e => { throw new Error(e.detail || 'Processing failed'); });
                return r.json();
            })
            .then(data => {
                clearInterval(pollInterval);
                setProgress(100, data.rows.length, data.rows.length, null);
                _currentFilename = data.filename;
                renderResults(data.columns, data.rows);
                loadHistory();
                document.getElementById('processBtn').disabled = false;
            })
            .catch(err => {
                clearInterval(pollInterval);
                document.getElementById('processBtn').disabled = false;
                alert('Error: ' + err.message);
            });
        }

        function setProgress(pct, done, total, eta_s) {
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressLabel').textContent = Math.round(pct) + '%';
            document.getElementById('progressRows').textContent = done + ' / ' + total;
            if (eta_s !== null) {
                const m = Math.floor(eta_s / 60), s = Math.round(eta_s % 60);
                document.getElementById('progressEta').textContent = m > 0 ? m + 'm ' + s + 's' : s + 's';
            } else {
                document.getElementById('progressEta').textContent = done === total ? 'Done' : 'Calculating...';
            }
        }

        function renderResults(columns, rows) {
            const header = document.getElementById('resultsHeader');
            const body = document.getElementById('resultsBody');
            header.innerHTML = columns.map(c => `<th>${c}</th>`).join('');
            body.innerHTML = rows.map(row => {
                const cells = row.map((cell, i) => {
                    if (columns[i] === 'Status') {
                        const cls = cell === 'VALID' ? 'badge-valid' : cell === 'EXPIRED' ? 'badge-expired' : 'badge-unknown';
                        return `<td><span class="status-badge ${cls}">${cell}</span></td>`;
                    }
                    return `<td>${cell ?? ''}</td>`;
                }).join('');
                return `<tr>${cells}</tr>`;
            }).join('');

            const statusIdx = columns.indexOf('Status');
            const expired = statusIdx >= 0 ? rows.filter(r => r[statusIdx] === 'EXPIRED').length : 0;
            const unknown = statusIdx >= 0 ? rows.filter(r => r[statusIdx] === 'UNKNOWN').length : 0;
            const summary = document.getElementById('resultsSummary');
            const parts = [];
            if (expired > 0) {
                parts.push(`<span style="background:#f8d7da;color:#842029;font-weight:600;padding:5px 12px;border-radius:6px;display:inline-block;"><i class="fas fa-exclamation-circle me-1"></i>${expired} expired MOT${expired !== 1 ? 's' : ''}</span>`);
            } else {
                parts.push(`<span style="background:#d1e7dd;color:#155724;font-weight:600;padding:5px 12px;border-radius:6px;display:inline-block;"><i class="fas fa-check-circle me-1"></i>No expired MOTs</span>`);
            }
            if (unknown > 0) {
                parts.push(`<span style="background:#e2e3e5;color:#41464b;font-weight:600;padding:5px 12px;border-radius:6px;display:inline-block;"><i class="fas fa-question-circle me-1"></i>${unknown} not found</span>`);
            }
            summary.innerHTML = `<div class="d-flex gap-2 flex-wrap">${parts.join('')}</div>`;

            document.getElementById('resultsCard').style.display = '';
        }

        function loadHistory() {
            fetch(BASE_URL + '/mot-check/history')
                .then(r => r.json())
                .then(items => {
                    const table = document.getElementById('historyTable');
                    const body  = document.getElementById('historyBody');
                    const empty = document.getElementById('historyEmpty');
                    if (!items.length) {
                        table.style.display = 'none';
                        empty.style.display = '';
                        return;
                    }
                    body.innerHTML = items.map(item => {
                        const expiredCell = item.expired_count != null
                            ? (item.expired_count > 0
                                ? `<td style="color:#842029;font-weight:600;">${item.expired_count}</td>`
                                : `<td style="color:#155724;">0</td>`)
                            : `<td>—</td>`;
                        const unknownCell = item.unknown_count != null
                            ? (item.unknown_count > 0
                                ? `<td style="color:#41464b;font-weight:600;">${item.unknown_count}</td>`
                                : `<td>0</td>`)
                            : `<td>—</td>`;
                        return `
                        <tr>
                            <td>${item.filename}</td>
                            <td>${item.ts}</td>
                            <td>${item.processed_by ?? '—'}</td>
                            <td>${item.size_kb} KB</td>
                            <td>${item.vrm_count != null ? item.vrm_count : '—'}</td>
                            ${expiredCell}
                            ${unknownCell}
                            <td>
                                <a href="${BASE_URL}/mot-check/download/${encodeURIComponent(item.filename)}" class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-download me-1"></i>XLSX
                                </a>
                            </td>
                        </tr>`;
                    }).join('');
                    table.style.display = '';
                    empty.style.display = 'none';
                })
                .catch(() => {});
        }

        function downloadCsv() {
            if (!_currentFilename) return;
            window.location.href = BASE_URL + '/mot-check/download/' + encodeURIComponent(_currentFilename);
        }

        loadHistory();
    </script>
</body>
</html>
