{% from '_navigation.html' import page_header with context %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Guide</title>
    <link rel="icon" type="image/png" href="{{ BASE_URL }}/static/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="{{ static_url('css/theme.css') }}" rel="stylesheet">
    <link href="{{ static_url('css/user_guide.css') }}" rel="stylesheet">
    <link href="{{ static_url('css/technical_guide.css') }}" rel="stylesheet">
    <style>
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Regular.ttf');  font-weight: 400; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Medium.ttf');   font-weight: 500; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-SemiBold.ttf'); font-weight: 600; }
        @font-face { font-family: 'DM Sans'; src: url('{{ BASE_URL }}/static/fonts/DMSans-Bold.ttf');     font-weight: 700; }
        body { font-family: 'DM Sans', system-ui, sans-serif; }
        :root { --guide-font-size: {{ settings.font_size }}px; --guide-nav-width: {{ settings.nav_width }}px; }
    </style>
</head>
<body>
    {{ page_header('Technical Guide', user) }}
    <div class="guide-layout">
        <nav class="panel guide-nav tg-nav" aria-label="Contents">
            <input type="search" class="form-control form-control-sm mb-2" id="tg-filter" placeholder="Find In Guide" autocomplete="off">
            <div id="tg-toc"></div>
        </nav>
        <main class="panel guide-content">
            <div class="guide-head">
                <h1 class="guide-title">Technical Guide</h1>
                <div class="guide-head-actions">
                    <span class="small text-muted">Admin only. Written from the code on 2026-11-05.</span>
                </div>
            </div>
            <div class="guide-text tg-text" id="tg-text">
                {% include 'technical_guide_content.html' %}
            </div>
        </main>
    </div>
    <script src="{{ static_url('js/technical_guide.js') }}"></script>
</body>
</html>
