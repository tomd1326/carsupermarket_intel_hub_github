<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="icon" type="image/png" href="{{ BASE_URL }}/static/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body, button, input, select, textarea { font-family: 'Aptos Display', system-ui, sans-serif; }
        .error-card { max-width: 560px; margin: 80px auto; }
        .error-icon { font-size: 2.5rem; }
        details summary { cursor: pointer; user-select: none; }
        pre { font-size: 0.78rem; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body class="bg-light">
    <div class="error-card card shadow-sm p-4">
        <div class="d-flex align-items-center gap-3 mb-3">
            <span class="error-icon">
                {% if error_type == "db_connection" %}
                    <i class="fas fa-plug text-warning"></i>
                {% else %}
                    <i class="fas fa-exclamation-triangle text-danger"></i>
                {% endif %}
            </span>
            <div>
                <h4 class="mb-0">{{ title }}</h4>
                <span class="text-muted small">HTTP 500</span>
            </div>
        </div>

        <p class="mb-3">{{ message }}</p>

        {% if hint %}
        <div class="alert alert-warning py-2 px-3 mb-3 small">
            <i class="fas fa-lightbulb me-1"></i>{{ hint }}
        </div>
        {% endif %}

        <div class="d-flex gap-2 mb-3">
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Go Back
            </a>
            <a href="{{ BASE_URL }}/home" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-home me-1"></i>Home
            </a>
        </div>

        {% if details %}
        <details class="small text-muted">
            <summary class="mb-2">Technical details</summary>
            <pre class="bg-white border rounded p-2 mt-2">{{ details }}</pre>
        </details>
        {% endif %}
    </div>
</body>
</html>
