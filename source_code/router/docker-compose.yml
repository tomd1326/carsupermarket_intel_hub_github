# This file creates two containers: aws lambda (compiled from local Dockerfile) and a DB (PostgreSQL)
# The lambda container is built from the Dockerfile in the source_code directory

version: '3.7'

services:
  aws_lambda:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        LOCAL_ENV: 1
#    image: "public.ecr.aws/lambda/python:3.9"
    container_name: uk_list_evaluator
    environment:
      - AWS_REGION=eu-west-1
      - AWS_LAMBDA_FUNCTION_NAME=uk-list-evaluator
      - LOCAL_ENV=1
    networks:
      - aws_lambda_network
    volumes:
      - ./:/var/task
    command: "main.handler"
#    entrypoint: "echo '' > /dev/null"
#    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: always
    ports:
      - "9000:8080"
      - "8000:8000"

  db:
    image: postgres:14
    container_name: uk_list_evaluator_db
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db
      POSTGRES_USER: test
    networks:
      - aws_lambda_network
    restart: always
    ports:
      - "5432:5432"

  cache:
    image: redis:6.2
    container_name: uk_list_evaluator_cache
    networks:
      - aws_lambda_network
    restart: always
    ports:
      - "6379:6379"

networks:
    aws_lambda_network:
        driver: bridge
